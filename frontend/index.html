<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Upload your lecture notes, ask anything, and get accurate answers backed by page-level sources." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>NoteMind — Your AI Study Partner</title>
    <script>
      // Applied before first paint so dark-mode users never see a white flash.
      (function () {
        try {
          var saved = localStorage.getItem('nm-theme');
          var dark = saved === 'dark' || ((!saved || saved === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
